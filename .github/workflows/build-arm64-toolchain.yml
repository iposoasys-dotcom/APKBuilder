name: Build ARM64 APKBuilder Toolchain

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-arm64-toolchain.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build real ARM64 toolchain
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout APKBuilder
        uses: actions/checkout@v4

      - name: Checkout Termux packages
        uses: actions/checkout@v4
        with:
          repository: termux/termux-packages
          path: termux-packages
          fetch-depth: 1

      - name: Install dependencies
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y \
            git \
            rsync \
            unzip \
            zip \
            file \
            jq \
            wget \
            curl \
            patchelf \
            clang \
            cmake \
            ninja-build \
            python3 \
            python3-pip \
            openjdk-17-jdk \
            binutils

      - name: Prepare Termux build environment
        working-directory: termux-packages
        run: |
          set -eux
          sudo ./scripts/setup-ubuntu.sh

      - name: Build ARM64 aapt package
        working-directory: termux-packages
        run: |
          set -eux
          ./build-package.sh -a aarch64 -I aapt

      - name: Locate generated ARM64 packages
        working-directory: termux-packages
        run: |
          set -eux

          echo "===== ALL GENERATED PACKAGES ====="
          find output -type f -name "*.deb" -print | sort

          AAPT_DEB="$(find output -type f -name "aapt_*.deb" -print -quit)"

          if [ -z "$AAPT_DEB" ]; then
            echo "ERROR: aapt ARM64 package was not generated."
            exit 1
          fi

          echo "AAPT_DEB=$AAPT_DEB" >> "$GITHUB_ENV"

      - name: Extract ARM64 native tools
        run: |
          set -eux
          rm -rf /tmp/aapt
          mkdir -p /tmp/aapt
          dpkg-deb -x "termux-packages/$AAPT_DEB" /tmp/aapt
          echo "===== EXTRACTED FILES ====="
          find /tmp/aapt -type f -print | sort
          mkdir -p toolchain/bin
          AAPT="$(find /tmp/aapt -type f -name aapt -print -quit)"
          AAPT2="$(find /tmp/aapt -type f -name aapt2 -print -quit)"
          AIDL="$(find /tmp/aapt -type f -name aidl -print -quit)"
          test -n "$AAPT"
          test -n "$AAPT2"
          test -n "$AIDL"
          cp "$AAPT" toolchain/bin/aapt
          cp "$AAPT2" toolchain/bin/aapt2
          cp "$AIDL" toolchain/bin/aidl
          chmod 755 toolchain/bin/aapt toolchain/bin/aapt2 toolchain/bin/aidl

      - name: Verify ARM64 native binaries
        run: |
          set -eux
          for binary in toolchain/bin/aapt toolchain/bin/aapt2 toolchain/bin/aidl; do
            echo "===== $binary ====="
            file "$binary"
            readelf -h "$binary" | grep -E "Class:|Machine:"
            test -x "$binary"
            file "$binary" | grep -Ei "ARM aarch64|ARM64|AArch64"
          done

      - name: Download Android command line tools
        run: |
          set -eux

          rm -rf /tmp/android-cmdline
          mkdir -p /tmp/android-cmdline
          cd /tmp/android-cmdline

          wget -q \
            "https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip" \
            -O commandlinetools.zip

          unzip -q commandlinetools.zip

          mkdir -p \
            "$GITHUB_WORKSPACE/toolchain/sdk/cmdline-tools/latest"

          cp -a \
            cmdline-tools/. \
            "$GITHUB_WORKSPACE/toolchain/sdk/cmdline-tools/latest/"

      - name: Install Android API 35 and Build Tools
        env:
          ANDROID_HOME: ${{ github.workspace }}/toolchain/sdk
          ANDROID_SDK_ROOT: ${{ github.workspace }}/toolchain/sdk
        run: |
          set -eux

          yes | \
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            --licenses >/dev/null || true

          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Add Java 17
        run: |
          set -eux

          mkdir -p toolchain/jdk

          cp -a \
            /usr/lib/jvm/java-17-openjdk-amd64/. \
            toolchain/jdk/

      - name: Add Android Java build tools
        run: |
          set -eux

          BUILD_TOOLS="$GITHUB_WORKSPACE/toolchain/sdk/build-tools/35.0.0"

          mkdir -p toolchain/java-tools

          test -f "$BUILD_TOOLS/lib/d8.jar"
          test -f "$BUILD_TOOLS/lib/apksigner.jar"

          cp \
            "$BUILD_TOOLS/lib/d8.jar" \
            toolchain/java-tools/

          cp \
            "$BUILD_TOOLS/lib/apksigner.jar" \
            toolchain/java-tools/

      - name: Create toolchain metadata
        run: |
          set -eux

          cat > toolchain/toolchain.properties <<'PROPS'
name=APKBuilder ARM64 Toolchain
version=5.0
architecture=arm64-v8a
termux_arch=aarch64
native_aapt=aarch64
native_aapt2=aarch64
native_aidl=aarch64
android_api=35
build_tools=35.0.0
java=17
build_mode=on-device
PROPS

      - name: Verify complete toolchain
        run: |
          set -eux

          echo "===== TOOLCHAIN FILES ====="
          find toolchain -type f -print | sort

          echo "===== AAPT ====="
          file toolchain/bin/aapt
          readelf -h toolchain/bin/aapt | grep -E "Class:|Machine:"

          echo "===== AAPT2 ====="
          file toolchain/bin/aapt2
          readelf -h toolchain/bin/aapt2 | grep -E "Class:|Machine:"

          echo "===== AIDL ====="
          file toolchain/bin/aidl
          readelf -h toolchain/bin/aidl | grep -E "Class:|Machine:"

          echo "===== ANDROID PLATFORM ====="
          test -f toolchain/sdk/platforms/android-35/android.jar

          echo "===== JAVA ====="
          test -x toolchain/jdk/bin/java
          toolchain/jdk/bin/java -version

          echo "===== D8 ====="
          test -f toolchain/java-tools/d8.jar

          echo "===== APKSIGNER ====="
          test -f toolchain/java-tools/apksigner.jar

          echo "===== METADATA ====="
          cat toolchain/toolchain.properties

      - name: Create ARM64 toolchain ZIP
        run: |
          set -eux

          rm -f APKBuilder-v2-arm64-toolchain.zip

          zip -r -q \
            APKBuilder-v2-arm64-toolchain.zip \
            toolchain

          echo "===== FINAL ZIP ====="
          ls -lh APKBuilder-v2-arm64-toolchain.zip

          echo "===== ZIP TEST ====="
          unzip -t APKBuilder-v2-arm64-toolchain.zip

      - name: Upload ARM64 toolchain
        uses: actions/upload-artifact@v4
        with:
          name: APKBuilder-v2-arm64-toolchain
          path: APKBuilder-v2-arm64-toolchain.zip
          retention-days: 30
          if-no-files-found: error
