name: Build ARM64 APKBuilder Toolchain

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-arm64-toolchain.yml"

permissions:
  contents: read

jobs:
  build-arm64-toolchain:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout APKBuilder
        uses: actions/checkout@v4

      - name: Checkout Termux package sources
        uses: actions/checkout@v4
        with:
          repository: termux/termux-packages
          path: termux-packages
          fetch-depth: 1

      - name: Prepare ARM64 Termux builder
        working-directory: termux-packages
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            docker.io \
            git \
            rsync \
            unzip \
            zip \
            file \
            jq \
            wget \
            curl \
            patchelf

          sudo systemctl start docker || true

          sudo usermod -aG docker "$USER" || true

      - name: Build ARM64 Android build-tools
        working-directory: termux-packages
        run: |
          set -eux

          echo "===== Building ARM64 aapt/aapt2/aidl ====="

          ./scripts/run-docker.sh \
            ./build-package.sh \
            -a aarch64 \
            -I \
            aapt

      - name: Locate ARM64 packages
        working-directory: termux-packages
        run: |
          set -eux

          echo "===== Generated packages ====="

          find output \
            -type f \
            \( \
              -name 'aapt_*.deb' \
              -o -name 'aapt2_*.deb' \
              -o -name 'aidl_*.deb' \
            \) \
            -print

          AAPT_DEB="$(find output -type f -name 'aapt_*.deb' -print -quit)"
          AAPT2_DEB="$(find output -type f -name 'aapt2_*.deb' -print -quit)"
          AIDL_DEB="$(find output -type f -name 'aidl_*.deb' -print -quit)"

          test -n "$AAPT_DEB"
          test -n "$AAPT2_DEB"
          test -n "$AIDL_DEB"

          echo "AAPT_DEB=$AAPT_DEB" >> "$GITHUB_ENV"
          echo "AAPT2_DEB=$AAPT2_DEB" >> "$GITHUB_ENV"
          echo "AIDL_DEB=$AIDL_DEB" >> "$GITHUB_ENV"

      - name: Extract ARM64 executables
        run: |
          set -eux

          rm -rf /tmp/aapt /tmp/aapt2 /tmp/aidl
          rm -rf toolchain

          mkdir -p \
            toolchain/bin \
            toolchain/lib \
            toolchain/sdk/platforms \
            toolchain/java-tools

          dpkg-deb -x \
            "termux-packages/$AAPT_DEB" \
            /tmp/aapt

          dpkg-deb -x \
            "termux-packages/$AAPT2_DEB" \
            /tmp/aapt2

          dpkg-deb -x \
            "termux-packages/$AIDL_DEB" \
            /tmp/aidl

          cp /tmp/aapt/data/data/com.termux/files/usr/bin/aapt \
            toolchain/bin/aapt

          cp /tmp/aapt2/data/data/com.termux/files/usr/bin/aapt2 \
            toolchain/bin/aapt2

          cp /tmp/aidl/data/data/com.termux/files/usr/bin/aidl \
            toolchain/bin/aidl

          chmod +x toolchain/bin/aapt
          chmod +x toolchain/bin/aapt2
          chmod +x toolchain/bin/aidl

      - name: Verify ARM64 binaries
        run: |
          set -eux

          for binary in \
            toolchain/bin/aapt \
            toolchain/bin/aapt2 \
            toolchain/bin/aidl
          do
            echo "===== $binary ====="
            file "$binary"
            readelf -h "$binary" | grep -E \
              "Class:|Machine:"
          done

          file toolchain/bin/aapt | grep -Ei \
            "ARM aarch64|ARM64|AArch64"

          file toolchain/bin/aapt2 | grep -Ei \
            "ARM aarch64|ARM64|AArch64"

          file toolchain/bin/aidl | grep -Ei \
            "ARM aarch64|ARM64|AArch64"

      - name: Download Android SDK platform
        run: |
          set -eux

          mkdir -p /tmp/android-cmdline

          cd /tmp/android-cmdline

          wget -q \
            "https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip" \
            -O commandlinetools.zip

          unzip -q commandlinetools.zip

          mkdir -p \
            "$GITHUB_WORKSPACE/toolchain/sdk/cmdline-tools/latest"

          cp -a \
            cmdline-tools/. \
            "$GITHUB_WORKSPACE/toolchain/sdk/cmdline-tools/latest/"

      - name: Install Android API 35 platform
        env:
          ANDROID_HOME: ${{ github.workspace }}/toolchain/sdk
          ANDROID_SDK_ROOT: ${{ github.workspace }}/toolchain/sdk
        run: |
          set -eux

          yes | \
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            --licenses >/dev/null || true

          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-35"

      - name: Add Java 17
        run: |
          set -eux

          sudo apt-get update
          sudo apt-get install -y openjdk-17-jdk

          mkdir -p toolchain/jdk

          cp -a \
            /usr/lib/jvm/java-17-openjdk-amd64/. \
            toolchain/jdk/

      - name: Add Java build tools
        run: |
          set -eux

          mkdir -p toolchain/java-tools

          BUILD_TOOLS="toolchain/java-tools"

          cp \
            "$(find /tmp -type f -name d8.jar -print -quit)" \
            "$BUILD_TOOLS/" 2>/dev/null || true

          cp \
            "$(find /tmp -type f -name apksigner.jar -print -quit)" \
            "$BUILD_TOOLS/" 2>/dev/null || true

      - name: Create toolchain metadata
        run: |
          cat > toolchain/toolchain.properties <<'PROPS'
name=APKBuilder ARM64 Toolchain
version=2.0
architecture=arm64-v8a
termux_arch=aarch64
native_aapt=aarch64
native_aapt2=aarch64
native_aidl=aarch64
android_api=35
java=17
build_mode=on-device
PROPS

      - name: Verify complete toolchain
        run: |
          set -eux

          echo "===== TOOLCHAIN FILES ====="

          find toolchain \
            -type f \
            -print | sort

          echo "===== NATIVE TOOLS ====="

          for binary in \
            toolchain/bin/aapt \
            toolchain/bin/aapt2 \
            toolchain/bin/aidl
          do
            test -x "$binary"
            file "$binary"
          done

          echo "===== METADATA ====="
          cat toolchain/toolchain.properties

      - name: Create ARM64 toolchain ZIP
        run: |
          set -eux

          rm -f APKBuilder-v2-arm64-toolchain.zip

          zip -r -q \
            APKBuilder-v2-arm64-toolchain.zip \
            toolchain

          echo "===== FINAL ZIP ====="
          ls -lh APKBuilder-v2-arm64-toolchain.zip

          unzip -l \
            APKBuilder-v2-arm64-toolchain.zip \
            | head -100

      - name: Upload ARM64 toolchain
        uses: actions/upload-artifact@v4
        with:
          name: APKBuilder-v2-arm64-toolchain
          path: APKBuilder-v2-arm64-toolchain.zip
          retention-days: 30
          if-no-files-found: error
