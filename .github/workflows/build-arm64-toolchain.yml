name: Build ARM64 APKBuilder Toolchain

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/build-arm64-toolchain.yml

permissions:
  contents: read

jobs:
  build-arm64-toolchain:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout APKBuilder
        uses: actions/checkout@v4

      - name: Checkout Termux packages
        uses: actions/checkout@v4
        with:
          repository: termux/termux-packages
          path: termux-packages
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y \
            git \
            rsync \
            unzip \
            zip \
            file \
            jq \
            wget \
            curl \
            patchelf \
            clang \
            cmake \
            ninja-build \
            python3 \
            python3-pip \
            openjdk-17-jdk

      - name: Prepare Termux build environment
        working-directory: termux-packages
        run: |
          set -eux
          sudo ./scripts/setup-ubuntu.sh

      - name: Build ARM64 aapt package
        working-directory: termux-packages
        run: |
          set -eux
          ./build-package.sh -a aarch64 -I aapt

      - name: Locate ARM64 packages
        working-directory: termux-packages
        run: |
          set -eux

          echo "===== PACKAGES ====="
          find output -type f -name '*.deb' -print

          AAPT_DEB="$(find output -type f -name 'aapt_*.deb' -print -quit)"

          if [ -z "$AAPT_DEB" ]; then
            echo "ERROR: ARM64 aapt package was not produced."
            exit 1
          fi

          echo "AAPT_DEB=$AAPT_DEB" >> "$GITHUB_ENV"

      - name: Extract ARM64 aapt
        run: |
          set -eux

          rm -rf /tmp/aapt
          mkdir -p /tmp/aapt

          dpkg-deb -x \
            "termux-packages/$AAPT_DEB" \
            /tmp/aapt

          AAPT="$(find /tmp/aapt -type f -name aapt -print -quit)"

          if [ -z "$AAPT" ]; then
            echo "ERROR: aapt executable not found."
            find /tmp/aapt -type f -print
            exit 1
          fi

          mkdir -p toolchain/bin

          cp "$AAPT" toolchain/bin/aapt
          chmod +x toolchain/bin/aapt

      - name: Verify ARM64 aapt
        run: |
          set -eux

          echo "===== AAPT ====="
          file toolchain/bin/aapt
          readelf -h toolchain/bin/aapt

          file toolchain/bin/aapt | grep -Ei \
            'ARM aarch64|ARM64|AArch64'

      - name: Download Android command line tools
        run: |
          set -eux

          rm -rf /tmp/android-cmdline
          mkdir -p /tmp/android-cmdline

          cd /tmp/android-cmdline

          wget -q \
            "https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip" \
            -O commandlinetools.zip

          unzip -q commandlinetools.zip

          mkdir -p \
            "$GITHUB_WORKSPACE/toolchain/sdk/cmdline-tools/latest"

          cp -a \
            cmdline-tools/. \
            "$GITHUB_WORKSPACE/toolchain/sdk/cmdline-tools/latest/"

      - name: Install Android API 35
        env:
          ANDROID_HOME: ${{ github.workspace }}/toolchain/sdk
          ANDROID_SDK_ROOT: ${{ github.workspace }}/toolchain/sdk
        run: |
          set -eux

          yes | \
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            --licenses >/dev/null || true

          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Add Java 17
        run: |
          set -eux

          mkdir -p toolchain/jdk

          cp -a \
            /usr/lib/jvm/java-17-openjdk-amd64/. \
            toolchain/jdk/

      - name: Add Java build components
        run: |
          set -eux

          mkdir -p toolchain/java-tools

          BUILD_TOOLS="$GITHUB_WORKSPACE/toolchain/sdk/build-tools/35.0.0"

          if [ -f "$BUILD_TOOLS/lib/d8.jar" ]; then
            cp "$BUILD_TOOLS/lib/d8.jar" toolchain/java-tools/
          fi

          if [ -f "$BUILD_TOOLS/lib/apksigner.jar" ]; then
            cp "$BUILD_TOOLS/lib/apksigner.jar" toolchain/java-tools/
          fi

      - name: Create metadata
        run: |
          set -eux

          cat > toolchain/toolchain.properties <<'PROPS'
name=APKBuilder ARM64 Toolchain
version=3.0
architecture=arm64-v8a
termux_arch=aarch64
native_aapt=aarch64
android_api=35
build_tools=35.0.0
java=17
build_mode=on-device
PROPS

      - name: Verify toolchain
        run: |
          set -eux

          echo "===== TOOLCHAIN FILES ====="
          find toolchain -type f -print | sort

          echo "===== NATIVE AAPT ====="
          file toolchain/bin/aapt
          readelf -h toolchain/bin/aapt | grep -E 'Class:|Machine:'

          echo "===== METADATA ====="
          cat toolchain/toolchain.properties

      - name: Create ARM64 toolchain ZIP
        run: |
          set -eux

          rm -f APKBuilder-v2-arm64-toolchain.zip

          zip -r -q \
            APKBuilder-v2-arm64-toolchain.zip \
            toolchain

          echo "===== FINAL ZIP ====="
          ls -lh APKBuilder-v2-arm64-toolchain.zip

          unzip -t \
            APKBuilder-v2-arm64-toolchain.zip

      - name: Upload ARM64 toolchain
        uses: actions/upload-artifact@v4
        with:
          name: APKBuilder-v2-arm64-toolchain
          path: APKBuilder-v2-arm64-toolchain.zip
          retention-days: 30
          if-no-files-found: error
