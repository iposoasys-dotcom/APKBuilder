name: Build ARM64 Android Toolchain

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-toolchain:
    runs-on: ubuntu-24.04

    steps:
      - name: Install tools
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y curl unzip zip file gzip

      - name: Download Android command line tools
        run: |
          set -eux

          mkdir -p work/cmdline
          mkdir -p work/sdk

          curl -L --fail --retry 5 \
            "https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip" \
            -o work/cmdline-tools.zip

          unzip -q \
            work/cmdline-tools.zip \
            -d work/cmdline

          mkdir -p work/sdk/cmdline-tools/latest

          cp -a \
            work/cmdline/cmdline-tools/. \
            work/sdk/cmdline-tools/latest/

      - name: Install Android SDK build tools
        run: |
          set -eux

          SDK="$GITHUB_WORKSPACE/work/sdk"

          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            --sdk_root="$SDK" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Inspect downloaded Android tools
        run: |
          set -eux

          SDK="$GITHUB_WORKSPACE/work/sdk"

          echo "===== SDK BUILD TOOLS ====="
          find "$SDK/build-tools/35.0.0" \
            -maxdepth 1 \
            -type f \
            -printf '%f\n'

          echo
          echo "===== ARCHITECTURES ====="

          for TOOL in \
            "$SDK/build-tools/35.0.0/aapt2" \
            "$SDK/build-tools/35.0.0/d8" \
            "$SDK/build-tools/35.0.0/zipalign" \
            "$SDK/build-tools/35.0.0/apksigner"
          do
            if [ -f "$TOOL" ]; then
              echo
              echo "===== $TOOL ====="
              file "$TOOL"
            fi
          done

      - name: Inspect command line tools
        run: |
          set -eux

          file \
            work/sdk/cmdline-tools/latest/bin/sdkmanager \
            || true

      - name: Create diagnostic artifact
        run: |
          set -eux

          mkdir -p diagnostic

          cp -a work/sdk/build-tools/35.0.0 diagnostic/build-tools

          find diagnostic \
            -type f \
            -exec chmod 755 {} \;

          file diagnostic/build-tools/* \
            > diagnostic/ARCHITECTURES.txt \
            || true

          cat diagnostic/ARCHITECTURES.txt

          zip -r \
            apkbuilder-toolchain-diagnostic.zip \
            diagnostic

      - name: Upload diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: apkbuilder-toolchain-diagnostic
          path: apkbuilder-toolchain-diagnostic.zip
          retention-days: 7
