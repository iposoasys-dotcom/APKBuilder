name: Build ARM64 APKBuilder Toolchain

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-arm64-toolchain.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build real ARM64 toolchain
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout APKBuilder
        uses: actions/checkout@v4

      - name: Prepare toolchain directories
        run: |
          set -eux
          rm -rf toolchain
          mkdir -p toolchain/bin
          mkdir -p toolchain/sdk
          mkdir -p toolchain/java-tools
          mkdir -p toolchain/jdk

      - name: Download ARM64 Android native build tools
        run: |
          set -eux

          BASE="https://github.com/Commit451/android-arm-build-tools/releases/download/platform-tools-35.0.1"

          for tool in aapt2 aidl zipalign split-select; do
            curl -L --fail --retry 5 \
              "$BASE/$tool" \
              -o "toolchain/bin/$tool"
            chmod 755 "toolchain/bin/$tool"
          done

      - name: Verify ARM64 native build tools
        run: |
          set -eux

          for binary in \
            toolchain/bin/aapt2 \
            toolchain/bin/aidl \
            toolchain/bin/zipalign \
            toolchain/bin/split-select
          do
            echo "===== $binary ====="
            file "$binary"
            readelf -h "$binary" | grep -E "Class:|Machine:"
            test -x "$binary"
            file "$binary" | grep -Ei "ARM aarch64|ARM64|AArch64"
          done

      - name: Download ARM64 JDK 17
        run: |
          set -eux

          curl -L --fail --retry 5 \
            "https://api.adoptium.net/v3/binary/latest/17/ga/linux/aarch64/jdk/hotspot/normal/eclipse" \
            -o arm64-jdk.tar.gz

          rm -rf /tmp/arm64-jdk
          mkdir -p /tmp/arm64-jdk

          tar -xzf arm64-jdk.tar.gz \
            -C /tmp/arm64-jdk

          JDK_DIR="$(find /tmp/arm64-jdk -mindepth 1 -maxdepth 1 -type d | head -1)"
          test -n "$JDK_DIR"

          cp -a "$JDK_DIR"/. toolchain/jdk/
          chmod 755 toolchain/jdk/bin/java

      - name: Verify ARM64 Java
        run: |
          set -eux

          file toolchain/jdk/bin/java
          readelf -h toolchain/jdk/bin/java | grep -E "Class:|Machine:"
          file toolchain/jdk/bin/java | grep -Ei "ARM aarch64|ARM64|AArch64"
          test -x toolchain/jdk/bin/java

      - name: Download Android command line tools
        run: |
          set -eux

          rm -rf /tmp/android-cmdline
          mkdir -p /tmp/android-cmdline
          cd /tmp/android-cmdline

          wget -q \
            "https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip" \
            -O commandlinetools.zip

          unzip -q commandlinetools.zip

          mkdir -p \
            "$GITHUB_WORKSPACE/toolchain/sdk/cmdline-tools/latest"

          cp -a \
            cmdline-tools/. \
            "$GITHUB_WORKSPACE/toolchain/sdk/cmdline-tools/latest/"

      - name: Install Android API 35 and Build Tools
        env:
          ANDROID_HOME: ${{ github.workspace }}/toolchain/sdk
          ANDROID_SDK_ROOT: ${{ github.workspace }}/toolchain/sdk
        run: |
          set -eux

          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true

          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Add Android Java build tools
        run: |
          set -eux

          BUILD_TOOLS="$GITHUB_WORKSPACE/toolchain/sdk/build-tools/35.0.0"

          test -f "$BUILD_TOOLS/lib/d8.jar"
          test -f "$BUILD_TOOLS/lib/apksigner.jar"

          cp "$BUILD_TOOLS/lib/d8.jar" toolchain/java-tools/d8.jar
          cp "$BUILD_TOOLS/lib/apksigner.jar" toolchain/java-tools/apksigner.jar

      - name: Create toolchain metadata
        run: |
          set -eux

          cat > toolchain/toolchain.properties <<'PROPS'
          name=APKBuilder ARM64 Toolchain
          version=6.0
          architecture=arm64-v8a
          termux_arch=aarch64
          native_aapt2=aarch64
          native_aidl=aarch64
          native_zipalign=aarch64
          native_split_select=aarch64
          android_api=35
          build_tools=35.0.0
          java=17
          java_arch=aarch64
          build_mode=on-device
          PROPS

      - name: Verify complete toolchain
        run: |
          set -eux

          echo "===== TOOLCHAIN FILES ====="
          find toolchain -type f -print | sort

          echo "===== AAPT2 ====="
          file toolchain/bin/aapt2
          readelf -h toolchain/bin/aapt2 | grep -E "Class:|Machine:"

          echo "===== AIDL ====="
          file toolchain/bin/aidl
          readelf -h toolchain/bin/aidl | grep -E "Class:|Machine:"

          echo "===== ZIPALIGN ====="
          file toolchain/bin/zipalign
          readelf -h toolchain/bin/zipalign | grep -E "Class:|Machine:"

          echo "===== SPLIT-SELECT ====="
          file toolchain/bin/split-select
          readelf -h toolchain/bin/split-select | grep -E "Class:|Machine:"

          echo "===== JAVA ====="
          test -x toolchain/jdk/bin/java
          file toolchain/jdk/bin/java
          readelf -h toolchain/jdk/bin/java | grep -E "Class:|Machine:"

          echo "===== ANDROID PLATFORM ====="
          test -f toolchain/sdk/platforms/android-35/android.jar

          echo "===== D8 ====="
            toolchain/java-tools/d8.jar

          echo "===== APKSIGNER ====="
            toolchain/java-tools/apksigner.jar

          echo "===== METADATA ====="
          cat toolchain/toolchain.properties

      - name: Create ARM64 toolchain ZIP
        run: |
          set -eux

          rm -f APKBuilder-v2-arm64-toolchain.zip

          zip -r -q \
            APKBuilder-v2-arm64-toolchain.zip \
            toolchain

          echo "===== FINAL ZIP ====="
          ls -lh APKBuilder-v2-arm64-toolchain.zip

          echo "===== ZIP TEST ====="
          unzip -t APKBuilder-v2-arm64-toolchain.zip

      - name: Upload ARM64 toolchain
        uses: actions/upload-artifact@v4
        with:
          name: APKBuilder-v2-arm64-toolchain
          path: APKBuilder-v2-arm64-toolchain.zip
          retention-days: 30
          if-no-files-found: error
