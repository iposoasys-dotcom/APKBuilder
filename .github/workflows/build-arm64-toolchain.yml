name: Build ARM64 APKBuilder Toolchain

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-arm64-toolchain.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04

    steps:
      - name: Test GitHub Actions runner
        run: |
          set -eux
          echo "GitHub ARM64 toolchain workflow started"
          uname -a
          uname -m
          file /bin/bash

      - name: Create test artifact
        run: |
          mkdir -p toolchain/bin
          printf '%s\n' \
            'name=APKBuilder ARM64 Toolchain' \
            'architecture=arm64-v8a' \
            'termux_arch=aarch64' \
            'status=workflow-test' \
            > toolchain/toolchain.properties

          zip -r APKBuilder-v2-arm64-toolchain.zip toolchain

      - name: Upload test artifact
        uses: actions/upload-artifact@v4
        with:
          name: APKBuilder-v2-arm64-toolchain
          path: APKBuilder-v2-arm64-toolchain.zip
          if-no-files-found: error
